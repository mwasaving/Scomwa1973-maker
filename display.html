<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>จอแสดงคิว — ระบบจองคิว</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <!--
    จอแสดงคิว ณ จุดให้บริการ (เปิดบนทีวี / จอคอมพิวเตอร์ แล้วกดเต็มจอ)
    พารามิเตอร์ (ไม่บังคับ):
      ?depts=FIN,LOAN   แสดงเฉพาะแผนก (รหัสจากชีต Departments)  — ไม่ใส่ = ทุกแผนก
      &voice=0          ปิดเสียงพูดประกาศ (ยังมีเสียงกริ่ง)
      &sound=0          ปิดเสียงทั้งหมด
      &poll=4           ความถี่ดึงข้อมูล (วินาที, ขั้นต่ำ 3)
      &screen=LOBBY     ชื่อจอนี้ (ใช้กับคอลัมน์ Screens ในชีต Media เพื่อแสดงสื่อเฉพาะจอ)
      &media=0          ไม่แสดงสื่อประชาสัมพันธ์บนจอนี้
    สื่อประชาสัมพันธ์ (รูปภาพ / วิดีโอ / YouTube) จัดการในชีต Media — มีสื่อ = จอแบ่งเป็น สื่อ (ซ้าย) + คิว (ขวา)
  -->
  <style>
    :root {
      --bg: #062a24; --panel: #0b3a32; --panel2: #0f4a40; --line: #1d5e52;
      --ink: #f1f5f9; --muted: #9fc9bd; --accent: #fbbf24; --ok: #34d399;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: 'Sarabun', system-ui, sans-serif; background: var(--bg); color: var(--ink);
      display: flex; flex-direction: column; overflow: hidden; cursor: default;
    }
    header {
      display: flex; align-items: center; gap: 1.2vw; padding: 1.2vh 2vw;
      background: linear-gradient(90deg, #047857, #0f766e); box-shadow: 0 2px 10px rgba(0,0,0,.25);
    }
    #logo { height: 6.5vh; width: 6.5vh; border-radius: 50%; background: #fff; padding: .3vh; object-fit: contain; }
    .brand { flex: 1; min-width: 0; line-height: 1.2; }
    .brand b { display: block; font-size: 2.6vh; font-weight: 800; }
    .brand span { font-size: 1.8vh; opacity: .85; }
    .clock { text-align: right; line-height: 1.1; }
    #clock { font-size: 4.6vh; font-weight: 800; font-variant-numeric: tabular-nums; }
    #today { font-size: 1.7vh; opacity: .9; }
    #net { width: 1.4vh; height: 1.4vh; border-radius: 50%; background: var(--ok); display: inline-block; margin-left: .6vw; vertical-align: middle; }
    #net.bad { background: #f87171; }

    main { flex: 1; min-height: 0; display: grid; grid-template-rows: 46% 1fr; gap: 1.6vh; padding: 1.6vh 2vw; }
    .top { display: grid; grid-template-columns: 1.55fr 1fr; gap: 1.6vh 1.4vw; min-height: 0; }

    #hero {
      background: var(--panel); border: .3vh solid var(--line); border-radius: 2.4vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 1vh 2vw;
      transition: background .3s, border-color .3s;
    }
    #hero.flash { animation: flash 1s ease-in-out 6; border-color: var(--accent); }
    @keyframes flash { 50% { background: #0f5f4f; } }
    .hero-label { font-size: 3.2vh; color: var(--muted); font-weight: 600; }
    #hero-q { font-size: 17vh; line-height: 1; font-weight: 800; color: var(--accent); letter-spacing: .08em; font-variant-numeric: tabular-nums; }
    .hero-to { font-size: 5vh; font-weight: 700; margin-top: .6vh; }
    .hero-to b { color: #fff; background: #047857; padding: .2vh 1.4vw; border-radius: 1.4vh; }
    #hero-d { font-size: 2.8vh; color: var(--muted); margin-top: 1vh; }
    #hero-empty { font-size: 4vh; color: var(--muted); }

    .recent { background: var(--panel); border-radius: 2.4vh; padding: 1.6vh 1.4vw; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
    h2 { margin: 0 0 1vh; font-size: 2.4vh; color: var(--muted); font-weight: 700; }
    .recent table { width: 100%; border-collapse: collapse; font-size: 3.4vh; }
    .recent th { font-size: 1.8vh; color: var(--muted); font-weight: 600; text-align: left; padding-bottom: .6vh; border-bottom: .2vh solid var(--line); }
    .recent td { padding: .7vh 0; border-bottom: .15vh solid var(--line); }
    .recent td.q { font-weight: 800; color: var(--accent); letter-spacing: .05em; }
    .recent td.c { font-weight: 700; }
    .recent td.d { font-size: 2vh; color: var(--muted); }
    .recent tr:first-child td { color: #fff; }
    .recent tr:first-child td.q { color: var(--accent); }

    #depts { display: grid; gap: 1.4vh 1.2vw; grid-template-columns: repeat(var(--cols, 3), 1fr); grid-auto-rows: 1fr; min-height: 0; }
    .dept { background: var(--panel); border-radius: 2vh; padding: 1.2vh 1.1vw; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
    .dept-h { display: flex; align-items: baseline; gap: .6vw; border-bottom: .2vh solid var(--line); padding-bottom: .6vh; margin-bottom: .6vh; }
    .dept-h b { font-size: 2.6vh; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dept-h span { font-size: 1.9vh; color: var(--muted); white-space: nowrap; }
    .dept-h span em { font-style: normal; color: var(--accent); font-weight: 800; font-size: 2.4vh; }
    .ctrs { display: grid; grid-template-columns: repeat(auto-fill, minmax(11vw, 1fr)); gap: .3vh .8vw; }
    .ctr { display: flex; justify-content: space-between; align-items: center; font-size: 2.6vh; padding: .35vh .6vw; border-radius: 1vh; }
    .ctr .n { color: var(--muted); font-size: 2vh; }
    .ctr .v { font-weight: 800; letter-spacing: .05em; }
    .ctr .v.idle { color: #5f8f84; font-weight: 600; font-size: 2vh; letter-spacing: 0; }
    .ctr.hot { background: #047857; animation: flash 1s ease-in-out 6; }
    .next { margin-top: auto; padding-top: .6vh; font-size: 1.9vh; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .next b { color: var(--ink); font-weight: 700; margin-left: .4vw; }

    /* ---- คิวที่เรียกผ่าน (แสดงเมื่อมี) ---- */
    #skip { display: flex; align-items: center; gap: 1.2vw; margin: 0 2vw 1.4vh; padding: 1vh 1.4vw; border-radius: 1.8vh;
            background: #3b0d14; border: .25vh solid #9f1239; min-height: 0; }
    #skip .t { flex: none; line-height: 1.15; }
    #skip .t b { display: block; font-size: 2.5vh; color: #fecdd3; }
    #skip .t span { font-size: 1.8vh; color: #fda4af; }
    #skip-list { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: .8vh .6vw; max-height: 10.5vh; overflow: hidden; }
    #skip-list span { background: #881337; border-radius: 1.2vh; padding: .3vh .9vw; font-size: 3vh; font-weight: 800; letter-spacing: .04em; white-space: nowrap; }
    #skip-list span small { font-size: 1.7vh; font-weight: 600; color: #fecdd3; margin-left: .5vw; letter-spacing: 0; }

    footer { background: #04211c; border-top: .2vh solid var(--line); padding: .9vh 0; overflow: hidden; white-space: nowrap; font-size: 2.3vh; }
    #ticker { display: inline-block; padding-left: 100%; animation: ticker 28s linear infinite; }
    @keyframes ticker { to { transform: translateX(-100%); } }

    #start {
      position: fixed; inset: 0; background: rgba(2, 20, 17, .92); display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 2vh; text-align: center; cursor: pointer; z-index: 10;
    }
    #start b { font-size: 4.6vh; }
    #start span { font-size: 2.4vh; color: var(--muted); }
    #start i { font-style: normal; font-size: 10vh; }
    #err { position: fixed; left: 50%; bottom: 7vh; transform: translateX(-50%); background: #b91c1c; padding: 1vh 2vw; border-radius: 1.2vh; font-size: 2.2vh; }

    /* ---- สื่อประชาสัมพันธ์ (มีรายการในชีต Media) ---- */
    #media { position: relative; background: #021512; border-radius: 2.4vh; overflow: hidden; min-height: 0; }
    #m-stage > * { position: absolute; left: 0; top: 0; width: 100%; height: 100%; border: 0; object-fit: contain; opacity: 0; transition: opacity .8s; }
    #m-stage > .on { opacity: 1; }
    #m-stage > .ph { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.4vh; text-align: center;
                     background: radial-gradient(circle at 50% 40%, #0f4a40 0%, #021512 75%); }
    #m-stage > .ph img { width: 34vh; height: 34vh; object-fit: contain; border-radius: 50%; background: #f1f5f9; padding: 1vh; position: static; opacity: 1; }
    #m-stage > .ph b { font-size: 4vh; font-weight: 800; padding: 0 3vw; }
    #m-stage > .ph span { font-size: 2.8vh; color: var(--muted); }
    #m-cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 2vh 1.6vw 1.4vh; font-size: 2.8vh; font-weight: 700;
             background: linear-gradient(transparent, rgba(0, 0, 0, .75)); }
    #callpop { position: absolute; inset: 0; background: rgba(4, 60, 48, .95); display: flex; flex-direction: column;
               align-items: center; justify-content: center; text-align: center; animation: popin .35s ease-out; }
    @keyframes popin { from { opacity: 0; transform: scale(.94); } }
    #callpop .l { font-size: 4vh; color: var(--muted); font-weight: 600; }
    #cp-q { font-size: 24vh; line-height: 1; font-weight: 800; color: var(--accent); letter-spacing: .06em; }
    #cp-c { font-size: 6.5vh; font-weight: 800; margin-top: 1vh; }
    #cp-d { font-size: 3.4vh; color: var(--muted); margin-top: 1vh; }
    body.with-media main { grid-template-columns: 1.75fr 1fr; grid-template-rows: auto auto 1fr; gap: 1.4vh 1.2vw; }
    body.with-media .top { display: contents; }
    body.with-media #media { grid-column: 1; grid-row: 1 / span 3; }
    body.with-media #hero { grid-column: 2; grid-row: 1; padding: 1.6vh 1vw; }
    body.with-media .hero-label, body.with-media #hero-empty { font-size: 2.6vh; }
    body.with-media #hero-q { font-size: 11vh; }
    body.with-media .hero-to { font-size: 3.4vh; }
    body.with-media #hero-d { font-size: 2.2vh; margin-top: .6vh; }
    body.with-media .recent { display: none; }   /* โหมดสื่อ: ช่องเรียกคิว + รายการแผนก แสดงคิวที่กำลังให้บริการครบแล้ว */
    body.with-media #depts { grid-column: 2; grid-row: 2 / span 2; grid-template-columns: 1fr; grid-auto-rows: auto; align-content: start; gap: 1vh; overflow: hidden; }
    body.with-media .dept { padding: .8vh .9vw; flex-direction: row; align-items: center; gap: .8vw; flex: none; }
    body.with-media .dept-h { margin: 0; padding: 0; border: 0; flex: 1; min-width: 0; flex-direction: column; align-items: flex-start; gap: .2vh; }
    body.with-media .dept-h b { font-size: 2.3vh; max-width: 100%; }
    body.with-media .dept-h span { font-size: 1.8vh; }
    body.with-media .ctrs { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: .5vh .5vw; max-width: 60%; }
    body.with-media .ctr.off { display: none; }
    body.with-media .ctr { font-size: 2.1vh; padding: .2vh .6vw; gap: .6vw; background: var(--panel2); }
    body.with-media .ctr .n { font-size: 1.7vh; }
    body.with-media .ctr .v.idle { font-size: 1.7vh; }
    body.with-media .next { display: none; }

    @media (orientation: portrait) {
      main { grid-template-rows: auto 1fr; }
      .top { grid-template-columns: 1fr; }
      #hero { padding: 3vh 2vw; }
      #hero-q { font-size: 12vh; }
      .recent { display: none; }
      body.with-media main { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr; }
      body.with-media #media { grid-column: 1; grid-row: 1; aspect-ratio: 16 / 9; }
      body.with-media #hero { grid-column: 1; grid-row: 2; }
      body.with-media #depts { grid-column: 1; grid-row: 3; grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <img id="logo" alt="" hidden />
    <div class="brand"><b id="sys">ระบบจองคิวออนไลน์</b><span id="org"></span></div>
    <div class="clock"><div id="clock">--:--</div><div id="today"></div></div>
    <span id="net" title="การเชื่อมต่อ"></span>
  </header>

  <main>
    <section id="media" hidden>
      <div id="m-stage"></div>
      <div id="m-cap" hidden></div>
      <div id="callpop" hidden>
        <div class="l">ขอเชิญหมายเลข</div>
        <div id="cp-q"></div>
        <div id="cp-c"></div>
        <div id="cp-d"></div>
      </div>
    </section>
    <div class="top">
      <section id="hero">
        <div id="hero-empty">รอเรียกคิว</div>
        <div id="hero-box" hidden>
          <div class="hero-label">ขอเชิญหมายเลข</div>
          <div id="hero-q"></div>
          <div class="hero-to">ที่ <b>ช่องบริการ <span id="hero-c"></span></b></div>
          <div id="hero-d"></div>
        </div>
      </section>
      <section class="recent">
        <h2>เรียกล่าสุด</h2>
        <table><thead><tr><th>หมายเลข</th><th>ช่อง</th><th>แผนก</th></tr></thead><tbody id="recent"></tbody></table>
      </section>
    </div>
    <section id="depts"></section>
  </main>

  <section id="skip" hidden>
    <div class="t"><b>⏭️ คิวที่เรียกผ่านแล้ว</b><span>กรุณาติดต่อเจ้าหน้าที่</span></div>
    <div id="skip-list"></div>
  </section>

  <footer><span id="ticker"></span></footer>

  <div id="start">
    <i>🔊</i>
    <b>แตะหน้าจอเพื่อเริ่มแสดงคิว</b>
    <span>เปิดเสียงประกาศเรียกคิว และขยายเต็มจอ</span>
  </div>
  <div id="err" hidden></div>

<script>
const APP = {
  API_URL: 'https://script.google.com/macros/s/AKfycbxsWhekn5r2CQQ552TU6foeP6ENDifmzCUt63Kl3GOO253Dq2aL0pIroqJVs9s85-Exzw/exec',
};
const P = new URLSearchParams(location.search);
const OPT = {
  depts: (P.get('depts') || '').replace(/[^A-Za-z0-9_,-]/g, ''),
  voice: P.get('voice') !== '0',
  sound: P.get('sound') !== '0',
  poll: Math.max(3, parseInt(P.get('poll'), 10) || 4) * 1000,
  screen: (P.get('screen') || '').replace(/[^A-Za-z0-9_-]/g, ''),
  media: P.get('media') !== '0',
};
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const st = { data: null, seen: null, queue: [], speaking: false, hero: null, hot: {}, started: false, fails: 0 };

/* ------------------------------------------------------------------ นาฬิกา */
function tick() {
  const d = new Date();
  $('clock').textContent = d.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  $('today').textContent = d.toLocaleDateString('th-TH', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}

/* ------------------------------------------------------------------ ดึงข้อมูล */
async function poll() {
  try {
    const url = APP.API_URL + '?action=display' + (OPT.depts ? '&depts=' + encodeURIComponent(OPT.depts) : '')
      + (OPT.screen ? '&screen=' + encodeURIComponent(OPT.screen) : '');
    const r = await fetch(url, { cache: 'no-store' });
    const j = await r.json();
    if (!j || !j.ok) throw new Error((j && j.message) || 'โหลดข้อมูลไม่สำเร็จ');
    st.fails = 0;
    $('net').classList.remove('bad');
    $('err').hidden = true;
    apply(j.data);
  } catch (e) {
    st.fails++;
    $('net').classList.add('bad');
    if (st.fails >= 3) { $('err').textContent = 'ขาดการเชื่อมต่อ กำลังลองใหม่...'; $('err').hidden = false; }
  } finally {
    setTimeout(poll, OPT.poll);
  }
}

const callKey = (c) => c.deptId + '|' + c.queueNo + '|' + c.counter + '|' + c.at;

function apply(d) {
  const first = !st.data;
  st.data = d;
  if (first) brand(d);
  applyMedia(d.media);
  // คิวที่ถูกเรียกใหม่ (หรือเรียกซ้ำ) นับจากรอบก่อน → เข้าคิวประกาศ
  const keys = d.calls.map(callKey);
  if (st.seen) {
    const fresh = d.calls.filter((c) => !st.seen.has(callKey(c))).reverse();   // เก่า → ใหม่
    fresh.slice(-4).forEach((c) => announce(c));
  } else if (d.calls[0]) {
    showHero(d.calls[0], false);
  }
  st.seen = new Set(keys);
  // คิวบนช่องใหญ่ถูก "เรียกผ่าน" → แสดงคิวที่เรียกล่าสุดแทน
  if (st.hero && !st.queue.length && !st.speaking && (d.skipped || []).some((c) => c.deptId === st.hero.deptId && c.queueNo === st.hero.queueNo)) {
    st.hero = d.calls[0] || null; renderHero();
  }
  if (!d.calls.length) { st.hero = null; renderHero(); }
  renderRecent();
  renderDepts();
  renderSkip();
}

function renderSkip() {
  const L = st.data.skipped || [];
  $('skip').hidden = !L.length;
  $('skip-list').innerHTML = L.map((c) =>
    `<span>${esc(c.queueNo)}${c.counter ? `<small>ช่อง ${esc(c.counter)}</small>` : ''}</span>`).join('');
}

function brand(d) {
  $('sys').textContent = d.systemName || 'ระบบจองคิวออนไลน์';
  $('org').textContent = d.orgName || '';
  document.title = 'จอแสดงคิว — ' + (d.orgName || d.systemName || '');
  if (d.logoUrl) { $('logo').src = d.logoUrl; $('logo').hidden = false; $('logo').onerror = () => { $('logo').hidden = true; }; }
  const msg = d.announcement || '';
  $('ticker').textContent = msg;
  document.querySelector('footer').hidden = !msg;
  const n = d.depts.length;
  $('depts').style.setProperty('--cols', n <= 2 ? n || 1 : n <= 4 ? 2 : n <= 6 ? 3 : 4);
}

/* ------------------------------------------------------------------ แสดงผล */
function showHero(c, flash) {
  st.hero = c;
  renderHero();
  if (flash) {
    const h = $('hero');
    h.classList.remove('flash'); void h.offsetWidth; h.classList.add('flash');
    st.hot[c.deptId + '|' + c.counter] = Date.now();
    renderDepts();
    if (OPT.media) {   // กรอบสื่อ → แสดงเลขคิวทับสื่อชั่วคราว
      $('cp-q').textContent = c.queueNo;
      $('cp-c').textContent = 'ที่ช่องบริการ ' + c.counter;
      $('cp-d').textContent = c.deptName;
      $('callpop').hidden = false;
      clearTimeout(st.popTimer);
      st.popTimer = setTimeout(() => { $('callpop').hidden = true; }, 9000);
    }
  }
}

/* ------------------------------------------------------------------ สื่อประชาสัมพันธ์ (ชีต Media) */
st.media = { list: [], key: '', i: -1, timer: null, files: {} };

// ไฟล์ที่อัปโหลดผ่านหน้า Admin (เก็บใน Drive แบบส่วนตัว) → โหลดผ่าน API ครั้งเดียวแล้วเก็บไว้ในหน่วยความจำ
function loadFiles(list) {
  list.filter((it) => it.fileId && !st.media.files[it.fileId]).forEach((it) => {
    const rec = st.media.files[it.fileId] = { url: '' };
    fetch(APP.API_URL + '?action=mediaFile&id=' + encodeURIComponent(it.fileId), { cache: 'no-store' })
      .then((r) => r.json())
      .then((j) => {
        if (!j || !j.ok) throw new Error('mediaFile');
        const bin = atob(j.data.data), arr = new Uint8Array(bin.length);
        for (let k = 0; k < bin.length; k++) arr[k] = bin.charCodeAt(k);
        rec.url = URL.createObjectURL(new Blob([arr], { type: j.data.mime }));
      })
      .catch(() => { rec.url = it.src; rec.failed = true; })   // สำรอง: ลิงก์ Drive โดยตรง (ใช้ได้ถ้าแชร์ไฟล์ไว้)
      .finally(() => { if (st.media.waiting) { st.media.waiting = false; nextMedia(); } });
  });
}

function mediaSrc(it) {
  if (!it.fileId) return it.src;
  return (st.media.files[it.fileId] || {}).url || '';
}

function applyMedia(list) {
  list = OPT.media && Array.isArray(list) ? list : [];
  const key = JSON.stringify(list);
  if (key === st.media.key) return;
  st.media.key = key;
  st.media.list = list;
  // กรอบสื่อแสดงตลอดเวลา (ปิดได้ด้วย ?media=0) — ยังไม่มีสื่อ = แสดงโลโก้และข้อความต้อนรับ
  document.body.classList.toggle('with-media', OPT.media);
  $('media').hidden = !OPT.media;
  clearTimeout(st.media.timer);
  $('m-stage').innerHTML = '';
  $('m-cap').hidden = true;
  st.media.i = -1;
  st.media.waiting = false;
  loadFiles(list);
  if (list.length) nextMedia();
  else if (OPT.media) showPlaceholder();
}

function showPlaceholder() {
  const d = st.data || {};
  const el = document.createElement('div');
  el.className = 'ph on';
  el.innerHTML = (d.logoUrl ? `<img src="${esc(d.logoUrl)}" alt="">` : '') +
    `<b>${esc(d.orgName || d.systemName || '')}</b><span>ยินดีให้บริการ · กรุณารอเรียกคิวตามหมายเลข</span>`;
  const img = el.querySelector('img');
  if (img) img.onerror = () => img.remove();
  $('m-stage').appendChild(el);
}

function nextMedia() {
  const L = st.media.list;
  if (!L.length) return;
  clearTimeout(st.media.timer);
  // ข้ามรายการที่ไฟล์ยังโหลดไม่เสร็จ · ถ้ายังไม่มีรายการไหนพร้อม → แสดงหน้าต้อนรับรอไว้
  let it = null;
  for (let n = 0; n < L.length; n++) {
    const k = (st.media.i + 1 + n) % L.length;
    if (L[k].kind === 'youtube' || mediaSrc(L[k])) { st.media.i = k; it = L[k]; break; }
  }
  const stage = $('m-stage');
  if (!it) {
    st.media.waiting = true;
    if (!stage.children.length) showPlaceholder();
    return;
  }
  const src = mediaSrc(it);
  let el;
  if (it.kind === 'image') {
    el = document.createElement('img');
    el.alt = it.title || '';
    el.onerror = skipMedia;
    el.src = src;
  } else if (it.kind === 'video') {
    el = document.createElement('video');
    el.muted = true; el.autoplay = true; el.playsInline = true; el.loop = L.length === 1;
    el.onended = nextMedia;
    el.onerror = skipMedia;
    el.src = src;
  } else {
    const id = encodeURIComponent(it.src);
    el = document.createElement('iframe');
    el.allow = 'autoplay; encrypted-media';
    el.src = 'https://www.youtube-nocookie.com/embed/' + id + '?autoplay=1&mute=1&controls=0&loop=1&playlist=' + id + '&playsinline=1&rel=0&modestbranding=1';
  }
  stage.appendChild(el);
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('on')));
  [...stage.children].filter((x) => x !== el).forEach((x) => { x.classList.remove('on'); setTimeout(() => x.remove(), 900); });
  $('m-cap').textContent = it.title || '';
  $('m-cap').hidden = !it.title;
  if (L.length > 1) {
    // รูปภาพ/YouTube ตามจำนวนวินาที · วิดีโอเล่นจนจบ (ถ้ากำหนดวินาทีไว้จะตัดตามนั้น) — กันค้าง 15 นาที
    const sec = it.seconds || (it.kind === 'video' ? 900 : 10);
    st.media.timer = setTimeout(nextMedia, sec * 1000);
  }
}

function skipMedia() {
  if (st.media.list.length > 1) { clearTimeout(st.media.timer); st.media.timer = setTimeout(nextMedia, 1500); }
}

function renderHero() {
  const c = st.hero;
  $('hero-empty').hidden = !!c;
  $('hero-box').hidden = !c;
  if (!c) return;
  $('hero-q').textContent = c.queueNo;
  $('hero-c').textContent = c.counter;
  const d = (st.data.depts || []).find((x) => x.id === c.deptId);
  $('hero-d').textContent = (d ? d.icon + ' ' : '') + c.deptName;
}

function renderRecent() {
  $('recent').innerHTML = st.data.calls.slice(0, 5).map((c) =>
    `<tr><td class="q">${esc(c.queueNo)}</td><td class="c">${esc(c.counter)}</td><td class="d">${esc(c.deptName)}</td></tr>`).join('')
    || '<tr><td colspan="3" class="d">ยังไม่มีการเรียกคิว</td></tr>';
}

function renderDepts() {
  const now = Date.now();
  $('depts').innerHTML = st.data.depts.map((d) => {
    const by = {};
    d.serving.forEach((s) => { if (!by[s.counter]) by[s.counter] = s.queueNo; });
    const ctrs = (d.counterNos && d.counterNos.length ? d.counterNos : Object.keys(by)).map((n) => {
      const hot = now - (st.hot[d.id + '|' + n] || 0) < 6000;
      return `<div class="ctr${hot ? ' hot' : ''}${by[n] ? '' : ' off'}"><span class="n">ช่อง ${esc(n)}</span>` +
        (by[n] ? `<span class="v">${esc(by[n])}</span>` : '<span class="v idle">ว่าง</span>') + '</div>';
    }).join('');
    return `<div class="dept">
      <div class="dept-h"><b>${esc(d.icon)} ${esc(d.name)}</b><span>รอ <em>${d.waiting}</em> คิว</span></div>
      <div class="ctrs">${ctrs}</div>
      <div class="next">คิวถัดไป${d.next.length ? d.next.map((q) => `<b>${esc(q)}</b>`).join('') : ' <b>—</b>'}</div>
    </div>`;
  }).join('');
}

/* ------------------------------------------------------------------ เสียงประกาศ */
const TH_DIGIT = ['ศูนย์', 'หนึ่ง', 'สอง', 'สาม', 'สี่', 'ห้า', 'หก', 'เจ็ด', 'แปด', 'เก้า'];
const TH_LETTER = { A: 'เอ', B: 'บี', C: 'ซี', D: 'ดี', E: 'อี', F: 'เอฟ', G: 'จี', H: 'เอช', I: 'ไอ', J: 'เจ', K: 'เค', L: 'แอล',
  M: 'เอ็ม', N: 'เอ็น', O: 'โอ', P: 'พี', Q: 'คิว', R: 'อาร์', S: 'เอส', T: 'ที', U: 'ยู', V: 'วี', W: 'ดับเบิลยู', X: 'เอ็กซ์', Y: 'วาย', Z: 'แซด' };
const spell = (s) => String(s).toUpperCase().split('').map((ch) => (/\d/.test(ch) ? TH_DIGIT[+ch] : TH_LETTER[ch] || ch)).join(' ');

function announce(c) {
  st.queue.push(c);
  if (!st.speaking) nextAnnounce();
}

async function nextAnnounce() {
  const c = st.queue.shift();
  if (!c) { st.speaking = false; return; }
  st.speaking = true;
  showHero(c, true);
  if (st.started && OPT.sound) {
    await chime();
    if (OPT.voice) {
      const text = 'ขอเชิญหมายเลข ' + spell(c.queueNo) + ' ที่ช่องบริการ ' + spell(c.counter) + ' ค่ะ';
      await speak(text);
      await wait(600);
      await speak(text);
    }
  }
  await wait(1500);
  nextAnnounce();
}

const wait = (ms) => new Promise((r) => setTimeout(r, ms));
let audioCtx = null;

function chime() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = audioCtx.currentTime;
    [[784, 0], [659, 0.45]].forEach(([f, dt]) => {   // ติ๊ง-ต่อง
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0 + dt);
      g.gain.exponentialRampToValueAtTime(0.6, t0 + dt + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dt + 0.9);
      o.connect(g).connect(audioCtx.destination);
      o.start(t0 + dt); o.stop(t0 + dt + 1);
    });
  } catch (e) { /* ไม่มีเสียง */ }
  return wait(1300);
}

let thVoice = null;
function pickVoice() {
  const vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  thVoice = vs.find((v) => /^th/i.test(v.lang)) || null;
}

function speak(text) {
  return new Promise((resolve) => {
    if (!window.speechSynthesis) return resolve();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'th-TH'; u.rate = 0.9;
    if (thVoice) u.voice = thVoice;
    const done = () => { clearTimeout(guard); resolve(); };
    const guard = setTimeout(done, 9000);   // บางเครื่องไม่ส่ง onend
    u.onend = done; u.onerror = done;
    speechSynthesis.speak(u);
  });
}

/* ------------------------------------------------------------------ เริ่มทำงาน */
async function start() {
  if (st.started) return;
  st.started = true;
  $('start').hidden = true;
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); await audioCtx.resume(); } catch (e) {}
  try { if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen(); } catch (e) {}
  keepAwake();
}

let wakeLock = null;
async function keepAwake() {
  try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && st.started) keepAwake(); });

$('start').addEventListener('click', start);
document.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') start(); });
if (window.speechSynthesis) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
if (!OPT.sound) $('start').querySelector('span').textContent = 'โหมดไม่มีเสียง · ขยายเต็มจอ';
tick();
setInterval(tick, 1000);
setInterval(() => { if (st.data) renderDepts(); }, 2000);   // ล้างไฮไลต์ช่องที่เพิ่งเรียก
poll();
</script>
